</style><main><header><div><p class="eyebrow">LIVING GEOMETRY / CINEMATIC STUDY 01</p><h1>鼓動から、数式が生まれる。</h1><p>網目を伝わる光の脈。追従し、離れ、再び集まる粒子。<br>数式の断片が流れに織り込まれ、光のΣから∫へ変わる24秒。</p></div><p>1920 × 1080 / 30fps<br>音声なし</p></header><video controls playsinline preload="metadata" poster="../../media/riemann-living-geometry-24s.jpg" src="../../media/riemann-living-geometry-24s.mp4"></video><div class="chapters"><button data-t="0">00 鼓動する網目</button><button data-t="5">05 群れと数式の流れ</button><button data-t="10">10 光のΣ</button><button data-t="15">15 ∫への変形</button><button data-t="20">20 極限の式へ</button></div><nav><a href="../../media/riemann-living-geometry-24s.mp4" download>↓ MP4をダウンロード</a><a href="../../materials/riemann-integral-cinema/index.html?view=cinema&effect=living&v=living-v1#preview">ライブで再生・視点を操作する →</a></nav><p class="note">立体の網目と粒子は、各時刻の3D座標から描画しています。波面は数学を象徴する演出です。有限の和と定積分を等しいとはしておらず、等号は極限の式に用いています。120秒・30秒の本編は教材内に残しています。</p></main><script>const v=document.querySelector('video');document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{v.currentTime=Number(b.dataset.t);v.play().catch(()=>{})});</script></html>
