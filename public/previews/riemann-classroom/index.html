</style><main><header><div><p class="eyebrow">A QUESTION IN THE CLASSROOM / 数学Ⅲ</p><h1>教室から、黒板の向こうへ。</h1><p>夕光の中で始まる授業。カメラが黒板に近づき、チョークの曲線へ。<br>金・朱・青緑の光が、分割、和、極限の説明に合わせて広がります。</p></div><p id="editionInfo">120秒 / 1920 × 1080 / 30fps<br>ナレーションなし</p></header><div class="editions"><button data-mode="pc" aria-pressed="true">PC・電子黒板｜120秒</button><button data-mode="portrait" aria-pressed="false">縦画面｜30秒</button></div><div class="screen"><video controls playsinline preload="metadata" poster="../../media/riemann-classroom-pc.jpg" src="../../media/riemann-integral-120s-classroom.mp4"></video></div><div class="chapters"></div><section class="story"><figure><img src="../../media/riemann-classroom-room.jpg" alt="夕光の授業風景"><figcaption>01 夕光の教室<br>先生と生徒、黒板に生まれる問い。</figcaption></figure><figure><img src="../../media/riemann-classroom-close.jpg" alt="黒板へのクローズアップ"><figcaption>02 黒板へ近づく<br>曲線をたどり、説明の中へ入る。</figcaption></figure><figure><img src="../../media/riemann-classroom-sum.jpg" alt="発光する長方形と黒板の格子"><figcaption>03 チョークが光へ<br>長方形と格子を、同じ時間で細分化。</figcaption></figure><figure><img src="../../media/riemann-classroom-integral.jpg" alt="光の記号が黒板の奥に現れる"><figcaption>04 黒板の奥へ<br>光を集め、Σから∫へ。</figcaption></figure></section><nav><a id="download" download="riemann-integral-120s-classroom.mp4" href="../../media/riemann-integral-120s-classroom.mp4">↓ この版のMP4をダウンロード</a><a href="../../materials/riemann-integral-cinema/index.html?view=cinema&v=classroom#preview">教材・ライブ操作を開く →</a></nav><p class="note">教室から黒板へのカメラ移動と、動く数式・図形を組み合わせた新しい映画版です。黒板の周囲の光は演出です。計算用の曲線・長方形は右端和に対応し、定積分との等号は極限の式に用いています。</p></main><script>
