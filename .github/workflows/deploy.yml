name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Create dependency lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Verify trig integral cinema
        run: npm run test:trig-cinema

      - name: Verify trig equation mathematics
        run: npx vitest run materials/trig-equation-cinema/tests/math.test.ts

      - name: Build
        run: npm run build

      - name: Include verified same-origin lesson video
        run: |
          mkdir -p dist/media
          if ! curl --fail --location --retry 3 'https://github.com/hakunou22hr/-/releases/download/integral-differentiation-cinema-review-v4/integral-differentiation-cinema-90s-web-v1.mp4' -o dist/media/integral-differentiation-cinema-90s-web-v1.mp4; then
            # Retain the same verified asset when the Release endpoint is unavailable.
            curl --fail --location --retry 3 'https://hakunou22hr.github.io/-/media/integral-differentiation-cinema-90s-web-v1.mp4' -o dist/media/integral-differentiation-cinema-90s-web-v1.mp4
          fi
          echo 'd786ed5efd37cada9f9acdbd7e720e42c5506296d266c43ee146a273bc3e7949  dist/media/integral-differentiation-cinema-90s-web-v1.mp4' | sha256sum -c -

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-integral-playback:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Install playback browser
        run: |
          npm install --prefix /tmp/integral-browser-tools playwright@1.62.1
          node /tmp/integral-browser-tools/node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify infinite-area cinema playback and download
        run: node scripts/verify-infinite-area-playback.mjs
      - name: Verify sqrt Riemann lesson and MP4 playback
        run: node scripts/verify-sqrt-riemann-playback.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sqrt-riemann-live-playback-check
          path: work/sqrt-riemann-check/
      - name: Verify published lesson through its real URL
        run: node scripts/verify-integral-browser-playback.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integral-live-playback-check
          path: work/playback-check/

  verify-teisekibun-playback:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Install lesson playback browser
        run: |
          npm install --prefix /tmp/teisekibun-browser-tools playwright@1.62.1
          node /tmp/teisekibun-browser-tools/node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify published 90s and 30s movies and download
        env:
          PLAYWRIGHT_MODULE_PATH: /tmp/teisekibun-browser-tools/node_modules/playwright/index.mjs
          LESSON_ORIGIN: https://hakunou22hr.github.io/-
          CHECK_OUTPUT_DIR: work/teisekibun-playback-check
        run: node materials/teisekibun-to-bibun/render/playback.check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teisekibun-live-playback-check
          path: work/teisekibun-playback-check/

  verify-radian-cinema-playback:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /scripts/verify-radian-cinema-playback.mjs
            /materials/birth-of-radian/verification/cinema/media.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Install cinema playback browser
        run: |
          npm install --prefix /tmp/radian-browser-tools playwright@1.62.1
          node /tmp/radian-browser-tools/node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify published radian movies and download
        run: node scripts/verify-radian-cinema-playback.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radian-cinema-live-playback-check
          path: work/radian-playback-check/

  verify-rotation-volume-166:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: materials/rotation-volume-166/tests
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Install browser for the rotation-volume lesson
        run: |
          npm install --prefix /tmp/rotation166-browser playwright@1.62.1
          node /tmp/rotation166-browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify live 3D lesson and its 90-second MP4
        env:
          PLAYWRIGHT_MODULE_PATH: /tmp/rotation166-browser/node_modules/playwright/index.mjs
        run: |
          node materials/rotation-volume-166/tests/published.mjs
          node materials/rotation-volume-166/tests/short-published.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rotation-volume-166-live-check
          path: work/rotation-volume-166/

  verify-arc-length-cinema:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: materials/arc-length-cinema/tests
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Install arc-length playback browser
        run: |
          npm install --prefix /tmp/arc-length-browser playwright@1.62.1
          node /tmp/arc-length-browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify arc-length movies at the public URL
        env:
          PLAYWRIGHT_MODULE_PATH: /tmp/arc-length-browser/node_modules/playwright/index.mjs
        run: node materials/arc-length-cinema/tests/published.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc-length-cinema-live-check
          path: work/arc-length-cinema/

  verify-trig-equation-unit-circle:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /scripts/verify-trig-equation-playback.mjs
            /materials/trig-equation-unit-circle/verification/media.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Install trigonometric equation browser
        run: |
          npm install --prefix /tmp/trig-equation-browser-tools playwright@1.62.1
          node /tmp/trig-equation-browser-tools/node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify published movies and inquiry controls
        run: node scripts/verify-trig-equation-playback.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trig-equation-unit-circle-live-check
          path: work/trig-equation-live-check/

  verify-trig-equation-cinema:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: materials/trig-equation-cinema/tests
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Install playback browser
        run: |
          npm install --prefix /tmp/trig-equation-browser playwright@1.62.1
          node /tmp/trig-equation-browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Check films, controls and mobile layouts
        env:
          PLAYWRIGHT_MODULE_PATH: /tmp/trig-equation-browser/node_modules/playwright/index.mjs
          APP_URL: https://hakunou22hr.github.io/-/materials/trig-equation-cinema/?v=1
        run: node materials/trig-equation-cinema/tests/published.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trig-equation-cinema-live-check
          path: work/trig-equation-cinema/
