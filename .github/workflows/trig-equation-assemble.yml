name: Assemble rendered trigonometric equation movie
on:
  push:
    branches: [feat/trig-equation-unit-circle]
    paths: [.github/workflows/trig-equation-assemble.yml]
  workflow_dispatch:
    inputs:
      source_run:
        description: Render workflow run containing the three segments
        required: true
        default: '42925614893'
permissions:
  actions: read
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/trig-equation-unit-circle
          sparse-checkout: |
            /public/media/trig-equation-unit-circle-90s.mp4
          sparse-checkout-cone-mode: false
      - name: Install movie assembler
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.source_run || '42925614893' }}
          pattern: trig-equation-part-*
          merge-multiple: true
          path: parts
      - name: Assemble and verify
        run: |
          cat > join.txt <<'LIST'
          file 'parts/part-0.mp4'
          file 'parts/part-1.mp4'
          file 'parts/part-2.mp4'
          LIST
          mkdir -p public/media
          ffmpeg -v error -y -f concat -safe 0 -i join.txt -c copy -movflags +faststart public/media/trig-equation-unit-circle-90s.mp4
          ffmpeg -v error -i public/media/trig-equation-unit-circle-90s.mp4 -f null -
          ffprobe -v error -show_streams -show_format -of json public/media/trig-equation-unit-circle-90s.mp4 > info.json
          node -e "const i=require('./info.json'),a=require('assert/strict');a.equal(+i.format.duration,90);a.equal(+i.streams[0].nb_frames,2160);a.equal(i.streams[0].width,1920);a.equal(i.streams[0].height,1080);a(+i.format.size<100*1024*1024)"
      - name: Save verified movie
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse public/media/trig-equation-unit-circle-90s.mp4
          git commit -m 'Assemble verified full-HD trigonometric equation movie'
          git push origin HEAD:feat/trig-equation-unit-circle
