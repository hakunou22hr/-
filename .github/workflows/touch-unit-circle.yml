name: Render and publish touch unit circle film
on:
  push:
    branches: [main]
    paths:
      - 'materials/touch-unit-circle/**'
      - '.github/workflows/touch-unit-circle.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: touch-unit-circle-film
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: materials/touch-unit-circle
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Check whether this edition is already published
        id: film
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view touch-unit-circle-v6 --json assets --jq '.assets[].name' | grep -qx 'touch-unit-circle-180s-v6.mp4'; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Install render tools
        if: steps.film.outputs.exists != 'true'
        run: |
          npm install --prefix /tmp/touch-browser playwright --no-audit --no-fund
          test -x /usr/bin/google-chrome
          if ! command -v ffmpeg >/dev/null; then
            sudo timeout 180 apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 install -y --no-install-recommends ffmpeg
          fi
          if ! fc-match 'Noto Sans CJK JP' --format '%{family}' | grep -q 'Noto Sans CJK'; then
            sudo timeout 180 apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 install -y --no-install-recommends fonts-noto-cjk
          fi
      - name: Mathematical verification
        run: |
          node materials/touch-unit-circle/tests/check.mjs
          node materials/touch-unit-circle/tests/cinematic.mjs
      - name: Render the shared 180-second timeline
        if: steps.film.outputs.exists != 'true'
        env:
          PLAYWRIGHT_MODULE: /tmp/touch-browser/node_modules/playwright/index.mjs
          CHROMIUM: /usr/bin/google-chrome
          OUTPUT: work/touch-unit-circle-180s-v6.mp4
        run: node materials/touch-unit-circle/render/movie.mjs
      - name: Verify complete movie
        if: steps.film.outputs.exists != 'true'
        run: |
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate -show_entries format=duration -of json work/touch-unit-circle-180s-v6.mp4 > work/video-probe.json
          python - <<'PY'
          import json
          p=json.load(open('work/video-probe.json'));s=p['streams'][0]
          assert s['codec_name']=='h264' and s['width']==1920 and s['height']==1080 and s['r_frame_rate']=='24/1'
          assert abs(float(p['format']['duration'])-180)<.1
          PY
          ffmpeg -v error -i work/touch-unit-circle-180s-v6.mp4 -f null -
      - name: Publish verified MP4
        if: steps.film.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create touch-unit-circle-v6 work/touch-unit-circle-180s-v6.mp4 --target "$GITHUB_SHA" --title '触れる、単位円。180秒の解説動画' --notes '1920×1080 / 24fps / H.264。教材と共通の数学モデル・描画・日本語字幕。既存教材・動画は保持。'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: touch-unit-circle-video-verification
          path: work/

  verify-published:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: materials/touch-unit-circle/tests
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Install browser
        run: npm install --prefix /tmp/touch-live playwright --no-audit --no-fund
      - name: Verify published fractions, similarity, library and actual MP4 playback
        env:
          PLAYWRIGHT_MODULE: /tmp/touch-live/node_modules/playwright/index.mjs
          CHROMIUM: /usr/bin/google-chrome
        run: node materials/touch-unit-circle/tests/published.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: touch-unit-circle-v6-live-verification
          path: work/touch-live/
