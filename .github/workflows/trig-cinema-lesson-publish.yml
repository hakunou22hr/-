name: Assemble and publish preserved 90-second lesson
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trig-cinema-lesson-publish.yml'
  workflow_dispatch:
    inputs:
      render_run_id:
        description: 'Workflow run containing preserved part-0 through part-3'
        default: '38662686046'
        required: true

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check draft release target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=trig-integral-cinema-90s-v2
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" --target "$GITHUB_SHA"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --draft --title '三角関数の不定積分 — 授業用90秒完全版' --notes-file materials/trig-integral-cinema/docs/INSTAGRAM_AND_LESSON.md
          fi
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.render_run_id || '38662686046' }}
          pattern: part-*
          path: work/lesson-parts
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Assemble preserved pictures and verify exact 90-second timing
        run: node materials/trig-integral-cinema/render/assemble-lesson.mjs
      - name: Preserve assembled MP4 and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovered-complete-trig-cinema-90s
          path: |
            work/trig-cinema-lesson/trig-integral-cinema-90s.mp4
            work/trig-cinema-lesson/ffprobe.json
            work/trig-cinema-lesson/SHA256SUMS.txt
          compression-level: 0
      - name: Publish verified MP4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=trig-integral-cinema-90s-v2
          gh release upload "$tag" work/trig-cinema-lesson/trig-integral-cinema-90s.mp4 work/trig-cinema-lesson/ffprobe.json work/trig-cinema-lesson/SHA256SUMS.txt --clobber
          gh release edit "$tag" --target "$GITHUB_SHA" --draft=false
