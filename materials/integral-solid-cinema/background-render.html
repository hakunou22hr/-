<!doctype html><html><meta charset="utf-8"><style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style><canvas id="backdrop"></canvas><script type="module">
import {paintBackground} from './dynamic-background.js';import {movieState} from './cinema-timeline.js';
const query=new URLSearchParams(location.search),portrait=query.has('portrait'),isolated=query.has('isolated');const canvas=document.querySelector('canvas');canvas.width=portrait?540:960;canvas.height=portrait?960:540;const ctx=canvas.getContext('2d',{alpha:false,willReadFrequently:true});const layer=document.createElement('canvas');layer.width=canvas.width;layer.height=canvas.height;const lc=layer.getContext('2d',{willReadFrequently:true});
window.backdrop={frame(t){const s=isolated?{mathTime:t,enter:1,exit:0,fade:0}:movieState(t,portrait);const mix=isolated?1:s.exit>0?1-Math.min(1,s.exit/.45):Math.max(0,Math.min(1,(s.enter-.8)/.2));paintBackground(lc,canvas.width,canvas.height,s.mathTime,{clock:t,opacity:mix*(1-s.fade),portrait,safeFrame:portrait,protect:!isolated});ctx.fillStyle='#000';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(layer,0,0);return canvas.toDataURL('image/jpeg',.9).split(',')[1]},png(t){this.frame(t);return canvas.toDataURL('image/png').split(',')[1]}};window.backdrop.frame(36);
</script></html>
