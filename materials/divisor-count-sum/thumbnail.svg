<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-labelledby="title desc"><title id="title">約数の個数と総和 ― 素因数分解から考える</title><desc id="desc">素因数の指数を選ぶ。約数の個数と総和</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#15283a"/><stop offset="1" stop-color="#0c1726"/></linearGradient><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="600" height="320" fill="url(#bg)"/><g font-family="system-ui,sans-serif"><text x="28" y="38" fill="#e5f1fa" font-size="21" text-anchor="start">素因数の指数を選ぶ</text><text x="95" y="95" fill="#6ce2e4" font-size="34" text-anchor="start">72</text><line x1="132" y1="107" x2="225" y2="138" stroke="#809db5" stroke-width="2"/><line x1="132" y1="107" x2="98" y2="138" stroke="#809db5" stroke-width="2"/><text x="91" y="161" fill="#ffcf78" font-size="26" text-anchor="start">2</text><text x="222" y="161" fill="#6ce2e4" font-size="26" text-anchor="start">36</text><text x="270" y="161" fill="#ba9cff" font-size="28" text-anchor="start">= 2³ × 3²</text><text x="300" y="218" fill="#ffcf78" font-size="26" text-anchor="middle">(3 + 1)(2 + 1) = 12</text><line x1="28" y1="279" x2="572" y2="279" stroke="#30475d" stroke-width="1"/><text x="300" y="304" fill="#809db5" font-size="17" text-anchor="middle">約数の個数と総和</text></g></svg>
