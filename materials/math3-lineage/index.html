<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050913"><meta name="description" content="30Sceneを連続再生。三平方・単位円・数列から極限、微分、積分、物理へつながる数学アニメーション教材。"><title>数学Ⅲの系譜 ― 極限・微分・積分へつながる数学</title></head>
<body><main class="cinema" aria-label="数学Ⅲの系譜">
<section class="stage" id="stage" aria-label="数学アニメーションステージ">
<canvas id="canvas" aria-label="現在の数学概念の動的な図形・グラフ"></canvas>
<header class="stage-header"><a href="../../" class="back">← 教材一覧</a><span class="wordmark">MATHEMATICS <b>Ⅲ</b> · LINEAGE</span><button id="scenes" aria-haspopup="dialog">30 Scene <span>☷</span></button></header>
<div class="scene-heading"><div class="eyebrow"><span id="chapter">PROLOGUE</span><span id="scene-number">01 / 30</span></div><h1 id="title" aria-live="polite">数学は、つながっている。</h1><p id="connection">数学Ⅰ・A・Ⅱ・B・C → 数学Ⅲ</p></div>
<div id="live" class="live" aria-live="off"></div>
<div class="stage-footer"><div id="formula" class="formula" aria-label="現在の数式"></div><p id="caption" class="caption"></p></div>
<div id="explore-panel" class="explore-panel" hidden><div class="explore-label">TOUCH THE MATHEMATICS <small id="drag-hint"></small></div><label><span id="param-label"></span><output id="param-value"></output><input id="parameter" type="range" min="0" max="1" step="0.001" value="0.5"></label><div id="wave-parameters" hidden><label>角周波数 ω <output id="frequency-value">1</output><input id="frequency" type="range" min="0.5" max="3" step="0.1" value="1"></label><label>位相 φ <output id="phase-value">0</output><input id="phase" type="range" min="-3.141593" max="3.141593" step="0.01" value="0"></label></div></div>
<p id="fallback" class="fallback" role="status" hidden>図の描画を利用できません。Scene・数式・解説は引き続き操作できます。</p>
</section>
<footer class="controls">
<div id="lineage" class="lineage" aria-label="数学の系譜"></div>
<div class="transport"><button id="previous" title="前のScene" aria-label="前のScene">◀</button><button id="play" class="play">▶ 全編再生</button><button id="next" title="次のScene" aria-label="次のScene">▶</button><button id="restart" title="最初から" aria-label="最初から">↺</button><div class="time"><span id="elapsed">00:00</span><span class="divider">/</span><span id="duration">10:30</span></div><label class="speed">速度 <select id="speed" aria-label="再生速度"><option value="0.5">0.5倍</option><option value="0.75">0.75倍</option><option value="1" selected>1倍</option><option value="1.25">1.25倍</option><option value="1.5">1.5倍</option><option value="2">2倍</option></select></label><button id="explore" class="explore" aria-pressed="false">◇ 探究モード</button><button id="fullscreen" aria-label="全画面表示" title="全画面表示">⛶</button></div>
<label class="seek-label"><span class="sr-only">全編の再生位置</span><input id="seek" type="range" min="0" max="630" step="0.1" value="0" aria-label="全編の再生位置"></label>
<nav class="jumps" aria-label="章へ移動"><button data-jump="0">全体を見る</button><button data-jump="9">極限だけ見る</button><button data-jump="15">微分だけ見る</button><button data-jump="24">積分だけ見る</button><button data-jump="22">物理とのつながり</button><span class="orientation">横画面にすると見やすくなります</span></nav>
</footer></main>
<dialog id="scene-dialog"><div class="dialog-heading"><div><small>CHAPTER INDEX</small><h2>数学の旅を選ぶ</h2></div><button id="close-scenes" aria-label="Scene一覧を閉じる">×</button></div><div id="scene-list"></div></dialog>
