<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-labelledby="title desc"><title id="title">三角形の個数 ― 平行線の交点</title><desc id="desc">一直線の3点を除く。平行線の交点から三角形を数える</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#15283a"/><stop offset="1" stop-color="#0c1726"/></linearGradient><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="600" height="320" fill="url(#bg)"/><g font-family="system-ui,sans-serif"><text x="28" y="38" fill="#e5f1fa" font-size="21" text-anchor="start">一直線の3点を除く</text><line x1="110" y1="105" x2="480" y2="105" stroke="#809db5" stroke-width="1.5"/><line x1="110" y1="150" x2="480" y2="150" stroke="#809db5" stroke-width="1.5"/><line x1="110" y1="195" x2="480" y2="195" stroke="#809db5" stroke-width="1.5"/><line x1="110" y1="240" x2="480" y2="240" stroke="#809db5" stroke-width="1.5"/><line x1="130" y1="80" x2="190" y2="262" stroke="#809db5" stroke-width="1.5"/><line x1="206" y1="80" x2="266" y2="262" stroke="#809db5" stroke-width="1.5"/><line x1="282" y1="80" x2="342" y2="262" stroke="#809db5" stroke-width="1.5"/><line x1="358" y1="80" x2="418" y2="262" stroke="#809db5" stroke-width="1.5"/><line x1="434" y1="80" x2="494" y2="262" stroke="#809db5" stroke-width="1.5"/><polygon points="182.75,240.00 214.24,105.00 395.91,195.00" stroke="#6ce2e4" fill="#6ce2e4" fill-opacity="0.133" stroke-width="3"/><circle cx="182.75" cy="240" r="6" fill="#ffcf78" filter="url(#glow)"/><circle cx="214.24" cy="105" r="6" fill="#ffcf78" filter="url(#glow)"/><circle cx="395.91" cy="195" r="6" fill="#ffcf78" filter="url(#glow)"/><line x1="28" y1="279" x2="572" y2="279" stroke="#30475d" stroke-width="1"/><text x="300" y="304" fill="#809db5" font-size="17" text-anchor="middle">平行線の交点から三角形を数える</text></g></svg>
