<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-labelledby="title desc"><title id="title">単位円と三角比</title><desc id="desc">単位円上の点Pを動かす。x = cos θ　y = sin θ</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#15283a" /><stop offset="1" stop-color="#0c1726" /></linearGradient><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="blur" /><feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge></filter></defs><rect width="600" height="320" fill="url(#bg)" /><g font-family="system-ui,sans-serif"><text x="28" y="38" fill="#e5f1fa" font-size="21" text-anchor="start">単位円上の点Pを動かす</text><g transform="translate(30 0) scale(.9)"><circle cx="300" cy="188" r="104" stroke="#6ce2e4" stroke-width="3" fill="none" /><line x1="155" y1="188" x2="460" y2="188" stroke="#809db5" stroke-width="1.5" /><line x1="300" y1="70" x2="300" y2="265" stroke="#809db5" stroke-width="1.5" /><line x1="300" y1="188" x2="373.5" y2="114.5" stroke="#6ce2e4" stroke-width="3" /><line x1="373.5" y1="188" x2="373.5" y2="114.5" stroke="#ffcf78" stroke-width="3" /><circle cx="373.5" cy="114.5" r="6" fill="#ffcf78" filter="url(#glow)" /><text x="387" y="112" fill="#ffcf78" font-size="20" text-anchor="start">P</text></g><line x1="28" y1="279" x2="572" y2="279" stroke="#30475d" stroke-width="1" /><text x="300" y="304" fill="#809db5" font-size="17" text-anchor="middle">x = cos θ　y = sin θ</text></g></svg>
