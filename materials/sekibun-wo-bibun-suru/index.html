<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>積分を微分する — 高画質MP4を保存</title><style>body{font-family:system-ui,sans-serif;background:#070c16;color:#e7eef3;max-width:680px;margin:8vh auto;padding:24px;line-height:1.9}h1{font-size:32px}button,.save{display:inline-block;background:#94efdf;color:#071524;padding:14px 24px;border:0;border-radius:8px;font-size:16px;font-weight:700;text-decoration:none;cursor:pointer}button:disabled{opacity:.5;cursor:wait}a{color:#94efdf}small{color:#a6b6c7}[hidden]{display:none!important}progress{width:100%;accent-color:#94efdf}#status{min-height:2em}.preview{display:block;width:100%;margin:25px 0;border-radius:10px}video{width:100%;max-height:60vh}</style></head><body><h1>積分を微分する</h1><p>教師を削除した高画質版。<strong>1080p · 30fps · 90秒</strong><br>日本語字幕付き・音声なし。</p><p id="size"></p><button id="download" disabled>高画質MP4を保存</button> <a class="save" id="save" hidden download="積分を微分する_90秒_高画質1080p.mp4">MP4を保存</a><p id="status" role="status">動画の情報を確認しています。</p><progress id="progress" hidden max="100" value="0"></progress><video id="preview" controls playsinline hidden></video><p>保存先の選択画面では「デスクトップ」を選んでください。自動保存された場合は、ダウンロードフォルダーから移動できます。</p><small>高画質版のため、ダウンロードには時間がかかる場合があります。教室はAI生成画像です。教師は冒頭・終盤ともに表示しません。</small><p><a href="../../">教材ライブラリへ</a></p><script>
const button=document.querySelector('#download'),save=document.querySelector('#save'),status=document.querySelector('#status'),progress=document.querySelector('#progress');let manifest,url;
fetch('../../media/sekibun-wo-bibun-suru/manifest.json?v=no-teacher-fhd').then(r=>{if(!r.ok)throw Error('manifest');return r.json()}).then(m=>{manifest=m;document.querySelector('#size').textContent=`MP4 / 約${(m.size/1000000).toFixed(1)}MB`;status.textContent='保存ボタンを押して動画を保存してください。';button.disabled=false}).catch(()=>{status.textContent='動画を読み込めません。ページを再読み込みしてください。'});
button.addEventListener('click',async()=>{let writer;button.disabled=true;progress.hidden=false;progress.value=0;try{
 let handle;if(typeof window.showSaveFilePicker==='function'){try{handle=await window.showSaveFilePicker({suggestedName:'積分を微分する_90秒_高画質1080p.mp4',startIn:'desktop',types:[{description:'MP4動画',accept:{'video/mp4':['.mp4']}}]});}catch(e){if(e.name==='AbortError')throw e;}}
 if(handle)writer=await handle.createWritable();const parts=[];let received=0;status.textContent='高画質動画を読み込んでいます。ページを閉じずにお待ちください。';
 for(const part of manifest.parts){const r=await fetch('../../media/sekibun-wo-bibun-suru/'+part.file+'?v=no-teacher-fhd');if(!r.ok)throw Error('fetch');const data=await r.arrayBuffer();if(data.byteLength!==part.size)throw Error('size');const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',data)),x=>x.toString(16).padStart(2,'0')).join('');if(hash!==part.sha256)throw Error('hash');if(writer)await writer.write(data);else parts.push(data);received+=data.byteLength;progress.value=received/manifest.size*100;status.textContent=`高画質動画を読み込んでいます ${Math.round(progress.value)}%`;}
 if(received!==manifest.size)throw Error('total');if(writer){await writer.close();writer=null;status.textContent='MP4を保存しました。選択したフォルダーをご確認ください。';button.textContent='もう一度保存';button.disabled=false;}else{if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(new Blob(parts,{type:'video/mp4'}));save.href=url;save.hidden=false;button.hidden=true;status.textContent='準備できました。「MP4を保存」を押してください。';const video=document.querySelector('#preview');video.src=url;video.hidden=false;}
 }catch(e){if(writer)await writer.abort().catch(()=>{});status.textContent=e.name==='AbortError'?'保存先の選択をキャンセルしました。':'保存できませんでした。ログインと通信状態を確認して、もう一度お試しください。';button.disabled=false;progress.hidden=true;}});
window.addEventListener('beforeunload',()=>{if(url)URL.revokeObjectURL(url)});
</script></body></html>
