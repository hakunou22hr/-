<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-labelledby="title desc"><title id="title">数学A｜同じものを含む順列と最短経路</title><desc id="desc">右へ、上へ。最短経路を数える。同じものを含む順列</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#15283a"/><stop offset="1" stop-color="#0c1726"/></linearGradient><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="600" height="320" fill="url(#bg)"/><g font-family="system-ui,sans-serif"><text x="28" y="38" fill="#e5f1fa" font-size="21" text-anchor="start">右へ、上へ。最短経路を数える</text><line x1="130" y1="90" x2="130" y2="250" stroke="#809db5" stroke-width="1"/><line x1="198" y1="90" x2="198" y2="250" stroke="#809db5" stroke-width="1"/><line x1="266" y1="90" x2="266" y2="250" stroke="#809db5" stroke-width="1"/><line x1="334" y1="90" x2="334" y2="250" stroke="#809db5" stroke-width="1"/><line x1="402" y1="90" x2="402" y2="250" stroke="#809db5" stroke-width="1"/><line x1="470" y1="90" x2="470" y2="250" stroke="#809db5" stroke-width="1"/><line x1="130" y1="90" x2="470" y2="90" stroke="#809db5" stroke-width="1"/><line x1="130" y1="130" x2="470" y2="130" stroke="#809db5" stroke-width="1"/><line x1="130" y1="170" x2="470" y2="170" stroke="#809db5" stroke-width="1"/><line x1="130" y1="210" x2="470" y2="210" stroke="#809db5" stroke-width="1"/><line x1="130" y1="250" x2="470" y2="250" stroke="#809db5" stroke-width="1"/><path d="M130.00,250.00 L198.00,250.00 L198.00,210.00 L266.00,210.00 L334.00,210.00 L334.00,170.00 L402.00,170.00 L402.00,130.00 L470.00,130.00 L470.00,90.00" stroke="#6ce2e4" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="130" cy="250" r="6" fill="#ffcf78" filter="url(#glow)"/><circle cx="470" cy="90" r="6" fill="#ffcf78" filter="url(#glow)"/><text x="101" y="260" fill="#ffcf78" font-size="18" text-anchor="start