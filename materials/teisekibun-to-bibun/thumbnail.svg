<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450"><defs><linearGradient id="bg"><stop stop-color="#070b22"/><stop offset="1" stop-color="#252044"/></linearGradient><linearGradient id="line"><stop stop-color="#6fe5ff"/><stop offset=".5" stop-color="#ffd68d"/><stop offset="1" stop-color="#b78dff"/></linearGradient></defs><rect width="800" height="450" rx="18" fill="url(#bg)"/><g fill="none" stroke="url(#line)"><path d="M0 300Q150 100 300 280T600 240T800 160" stroke-width="8" opacity=".2"/><path d="M0 300Q150 100 300 280T600 240T800 160" stroke-width="2"/><path d="M0 280Q150 140 300 300T600 200T800 180"/><path d="M0 320Q150 60 300 260T600 280T800 140"/></g><text x="50" y="70" fill="#8ce6ff" font-family="sans-serif" font-size="18" letter-spacing="4">THREE PATHS · ONE WAVE</text><text x="50" y="155" fill="#f4f7ff" font-family="sans-serif" font-size="51">定積分と微分</text><text x="400" y="252" text-anchor="middle" fill="#ffdda0" font-family="serif" font-style="italic" font-size="64">F′(x) = sin x</text><text x="50" y="390" fill="#aec6e1" font-family="sans-serif" font-size="21">３つの解法を、90秒の数学映画で。</text></svg>
