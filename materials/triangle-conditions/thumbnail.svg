<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-labelledby="title desc"><title id="title">三角形の成立条件</title><desc id="desc">三角形ができる条件。a + b &gt; c</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#15283a"/><stop offset="1" stop-color="#0c1726"/></linearGradient><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="600" height="320" fill="url(#bg)"/><g font-family="system-ui,sans-serif"><text x="28" y="38" fill="#e5f1fa" font-size="21" text-anchor="start">三角形ができる条件</text><polygon points="145.00,240.00 300.00,100.00 465.00,240.00" stroke="#6ce2e4" fill="#6ce2e4" fill-opacity="0.094" stroke-width="3"/><text x="198" y="163" fill="#ffcf78" font-size="22" text-anchor="start">a</text><text x="395" y="163" fill="#ffcf78" font-size="22" text-anchor="start">b</text><text x="300" y="269" fill="#ba9cff" font-size="22" text-anchor="middle">c</text><line x1="28" y1="279" x2="572" y2="279" stroke="#30475d" stroke-width="1"/><text x="300" y="304" fill="#809db5" font-size="17" text-anchor="middle">a + b &gt; c</text></g></svg>
