ry>背景の変更前・変更後を見る</summary><img class="comparison" src="./review/comparison.jpg" alt="左が変更前、右が変更後。右端法・左端法・収束・積分の4場面で、小さな渦の回転から、画面を横断して迫る大きな光の奔流へ変わった4場面を比較"></details></main><script type="module" src="./main.js"></script></body></html>
