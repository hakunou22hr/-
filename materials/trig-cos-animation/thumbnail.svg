<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-labelledby="title desc"><title id="title">cosを動かして理解する</title><desc id="desc">角度と横の長さの関係。cos θ = 横の長さ / 斜辺</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#15283a"/><stop offset="1" stop-color="#0c1726"/></linearGradient><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="600" height="320" fill="url(#bg)"/><g font-family="system-ui,sans-serif"><text x="28" y="38" fill="#e5f1fa" font-size="21" text-anchor="start">角度と横の長さの関係</text><polygon points="130.00,242.00 440.00,242.00 440.00,92.00" stroke="#6ce2e4" fill="#6ce2e4" fill-opacity="0.071" stroke-width="3"/><line x1="440" y1="242" x2="440" y2="92" stroke="#ffcf78" stroke-width="3"/><path d="M420.00,242.00 L420.00,222.00 L440.00,222.00" stroke="#809db5" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="275" y="269" fill="#ba9cff" font-size="16" text-anchor="start">横の長さ</text><text x="455" y="173" fill="#ffcf78" font-size="16" text-anchor="start">高さ</text><text x="254" y="139" fill="#6ce2e4" font-size="17" text-anchor="start">斜辺</text><text x="175" y="228" fill="#ffcf78" font-size="22" text-anchor="start">θ</text><line x1="28" y1="279" x2="572" y2="279" stroke="#30475d" stroke-width="1"/><text x="300" y="304" fill="#809db5" font-size="17" text-anchor="middle">cos θ = 横の長さ / 斜辺</text></g></svg>
