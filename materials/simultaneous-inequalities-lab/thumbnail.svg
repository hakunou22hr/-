<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-labelledby="title desc"><title id="title">連立不等式を見える化しよう</title><desc id="desc">数直線の共通部分。上段・中段を重ね、下段で確認</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#15283a"/><stop offset="1" stop-color="#0c1726"/></linearGradient><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="600" height="320" fill="url(#bg)"/><g font-family="system-ui,sans-serif"><text x="28" y="38" fill="#e5f1fa" font-size="21" text-anchor="start">数直線の共通部分</text><line x1="65" y1="108" x2="530" y2="108" stroke="#809db5" stroke-width="1.5"/><line x1="145" y1="108" x2="480" y2="108" stroke="#6ce2e4" stroke-width="8"/><circle cx="145" cy="108" r="6" stroke="#6ce2e4" stroke-width="2" fill="#101c2d"/><circle cx="480" cy="108" r="6" fill="#6ce2e4" filter="url(#glow)"/><line x1="65" y1="168" x2="530" y2="168" stroke="#809db5" stroke-width="1.5"/><line x1="90" y1="168" x2="360" y2="168" stroke="#ba9cff" stroke-width="8"/><circle cx="90" cy="168" r="6" stroke="#ba9cff" stroke-width="2" fill="#101c2d"/><circle cx="360" cy="168" r="6" fill="#ba9cff" filter="url(#glow)"/><line x1="65" y1="228" x2="530" y2="228" stroke="#809db5" stroke-width="1.5"/><line x1="145" y1="228" x2="360" y2="228" stroke="#ffcf78" stroke-width="8"/><circle cx="145" cy="228" r="6" stroke="#ffcf78" stroke-width="2" fill="#101c2d"/><circle cx="360" cy="228" r="6" fill="#ffcf78" filter="url(#glow)"/><line x1="28" y1="279" x2="572" y2="279" stroke="#30475d" stroke-width="1"/><text x="300" y="304" fill="#809db5" font-size="17" text-anchor="middle">上段・中段を重ね、下段で確認</text></g></svg>
