<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-labelledby="title desc"><title id="title">4領域の塗り分け</title><desc id="desc">隣り合う領域を塗り分ける。色の条件から、場合の数を数える</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#15283a"/><stop offset="1" stop-color="#0c1726"/></linearGradient><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="600" height="320" fill="url(#bg)"/><g font-family="system-ui,sans-serif"><text x="28" y="38" fill="#e5f1fa" font-size="21" text-anchor="start">隣り合う領域を塗り分ける</text><rect x="140" y="100" width="130" height="70" rx="8" fill="#6ce2e4" fill-opacity="0.145" stroke="#6ce2e4" stroke-width="2"/><text x="205" y="146" fill="#6ce2e4" font-size="19" text-anchor="middle">領域 3</text><rect x="330" y="100" width="130" height="70" rx="8" fill="#ba9cff" fill-opacity="0.145" stroke="#ba9cff" stroke-width="2"/><text x="395" y="146" fill="#ba9cff" font-size="19" text-anchor="middle">領域 4</text><rect x="140" y="185" width="130" height="70" rx="8" fill="#ffcf78" fill-opacity="0.145" stroke="#ffcf78" stroke-width="2"/><text x="205" y="231" fill="#ffcf78" font-size="19" text-anchor="middle">領域 2</text><rect x="330" y="185" width="130" height="70" rx="8" fill="#ff7e96" fill-opacity="0.145" stroke="#ff7e96" stroke-width="2"/><text x="395" y="231" fill="#ff7e96" font-size="19" text-anchor="middle">領域 1</text><line x1="28" y1="279" x2="572" y2="279" stroke="#30475d" stroke-width="1"/><text x="300" y="304" fill="#809db5" font-size="17" text-anchor="middle">色の条件から、場合の数を数える</text></g></svg>
