<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ラジアンの誕生｜映画版90秒</title><style>body{margin:0;background:#020711;color:#d6e5f0;font-family:Arial,sans-serif}#film{height:100vh;width:100vw;position:relative;overflow:hidden}canvas{display:block}#scene{position:absolute;left:4%;top:5%;font-size:clamp(10px,1vw,18px);letter-spacing:2px}#equation{position:absolute;left:3%;top:11%;width:94%;text-align:center;color:#ffe0a0;font-size:clamp(20px,2.5vw,48px);text-shadow:0 2px 15px #000}#caption{position:absolute;bottom:10%;left:7%;width:86%;text-align:center;font-size:clamp(13px,1.4vw,27px);letter-spacing:2px;text-shadow:0 2px 6px #000}#black{position:absolute;inset:0;background:#020711;pointer-events:none;z-index:2}.controls{position:absolute;left:4%;right:4%;bottom:3%;display:flex;align-items:center;gap:14px;z-index:3}button,a{color:#e7cc92;background:#071525c0;border:1px solid #4b617c;padding:9px 14px;border-radius:4px;text-decoration:none;cursor:pointer}input{flex:1;min-width:10px;accent-color:#d5b674}#clock{font:11px monospace}#fallback{position:absolute;inset:20%;line-height:2;background:#071525;padding:20px;z-index:3}.export .controls{display:none}.portrait #equation{top:15%;font-size:5.5vw}.portrait #caption{bottom:16%;font-size:3.3vw;line-height:1.8}.portrait #scene{font-size:2.4vw}@media(orientation:portrait){body:not(.portrait) #film{height:56.25vw;top:calc((100vh - 56.25vw)/2)}body:not(.portrait) #caption{font-size:11px}body:not(.portrait) #equation{font-size:20px}.controls a{display:none}}</style><div id="film"><span id="scene"></span><div id="equation"></div><div id="caption"></div><div id="half-count" hidden><div class="measure-head"><span>半径1本分を、ものさしに</span><strong id="half-total"></strong></div><div class="measure-track"><div class="unit-measure"><span>1本目</span><div class="measure-fill"></div></div><div class="unit-measure"><span>2本目</span><div class="measure-fill"></div></div><div class="unit-measure"><span>3本目</span><div class="measure-fill"></div></div><div class="unit-measure remainder-measure"><span>残り</span><div class="measure-fill"></div></div></div><p id="half-note"></p></div><div id="black"></div><div id="fallback" hidden>3D再生に対応していない環境です。<p>弧長 s = rθ。弧の長さが半径と等しい中心角が1 rad。半円はπ rad = 180°です。</p><a href="./">動画版を開く</a></div><div class="controls"><a href="./">← 教材</a><button id="play">▶ 再生</button><button id="restart" aria-label="最初から再生">↺</button><input id="seek" aria-label="再生位置" type="range" min="0" max="90" step=".01" value="0"><span id="clock"></span></div></div><script type="module" src="./cinema.js"></script></html>
