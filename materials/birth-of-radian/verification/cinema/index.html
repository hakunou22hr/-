<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ラジアンの誕生｜映画版シーン確認</title><style>*{box-sizing:border-box}body{max-width:1400px;margin:0 auto;padding:30px;background:#040b16;color:#dce7f3;font:15px/1.8 Arial,sans-serif}a{color:#e5c17d}h1{font-size:25px;font-weight:500}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:22px}figure{margin:0;background:#0b1829;border:1px solid #27415c;border-radius:8px;overflow:hidden}img{display:block;width:100%;height:auto}figcaption{padding:15px}b{color:#e5c17d;font-weight:400}p{color:#a4b9ce}</style><a href="../../">← 映画教材に戻る</a><h1>ラジアンの誕生｜映画版シーン確認</h1><p>3Dタイムラインの指定時刻を実際に描画した画面です。背景の円環、光の帯、粒子、カメラは再生時刻で変化します。</p><main><figure><img src="./6.jpg" alt="6秒：半径と発光する円環の宇宙"><figcaption><b>00:06 — 半径の誕生</b><br>中心から伸びる半径と、奥行きのある円環。</figcaption></figure><figure><img src="./20.jpg" alt="20秒：黄金の帯が円弧へ巻き付く途中"><figcaption><b>00:20 — 1ラジアンの誕生</b><br>中立軸の長さを保ち、直線部分を接線から円周へ巻く。</figcaption></figure><figure><img src="./42.jpg" alt="42秒：青と緑の円弧、巻き付く黄金の帯"><figcaption><b>00:42 — 半円に半径を巻く</b><br>単位長の光跡と、動く数式の床・立体リング。</figcaption></figure><figure><img src="./62.jpg" alt="62秒：黄金の立体πと半円の角度の導出"><figcaption><b>01:02 — πの出現</b><br>粒子が収束し、黄金の立体πが現れる。</figcaption></figure><figure><img src="./82.jpg" alt="82秒：180度イコールπラジアン"><figcaption><b>01:22 — 180° = π rad</b><br>正面に戻った半円と結論の数式。</figcaption></figure></main></html>
