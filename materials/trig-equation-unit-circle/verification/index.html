<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三角方程式と単位円｜シーン確認</title><style>*{box-sizing:border-box}body{margin:0 auto;max-width:1500px;padding:30px;background:#030a15;color:#d9ebf5;font:14px/1.8 sans-serif}a{color:#e3c182}h1{font-size:24px;font-weight:500}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,550px),1fr));gap:22px}figure{margin:0;background:#0a1929;border:1px solid #2b455c;border-radius:7px;overflow:hidden}img{width:100%;display:block}figcaption{padding:15px}b{color:#e6c589;font-weight:400}.portrait img{width:auto;max-width:100%;max-height:650px;margin:auto}p{color:#91adc5}</style><a href="../">← 教材へ戻る</a><h1>三角方程式と単位円｜映画と探究の確認</h1><p>完成したMP4から取り出した映像と、実際の操作画面です。背景のリング・格子・光・粒子は数学の出来事と同じ時刻で変化します。</p><main><figure><img src="./8.jpg" alt="tへの置き換えと単位円、−1〜1の範囲"><figcaption><b>01 / 8秒：置き換えと範囲</b><br>sinθがtへ移動・縮小。単位円の高さと光の数直線が同期。</figcaption></figure><figure><img src="./20.jpg" alt="金色と赤色に因数が分裂した3Dトンネル"><figcaption><b>02 / 20秒：因数分解</b><br>2つの因数と、背景のリングが別の方向へ分かれる。</figcaption></figure><figure><img src="./36.jpg" alt="高さ1/2の水平線と2つの交点、30度の直角三角形"><figcaption><b>03 / 36秒：右の交点は30°</b><br>水平線・交点・半径・直角三角形を同じ座標から構築。</figcaption></figure><figure><img src="./43.jpg" alt="150度へ回転した半径と、変形した直角三角形"><figcaption><b>03 / 43秒：左の交点は150°</b><br>反時計回りに回転しても、終点の高さは同じ半分。</figcaption></figure><figure><img src="./58.jpg" alt="単位円の最下点、270度と退化した三角形"><figcaption><b>04 / 58秒：最下点は1つだけ</b><br>x=0、y=−1。三角形は通常の三角形として表示せず、半径へ退化。</figcaption></figure><figure><img src="./82.jpg" alt="3つの解を弧度法の分数で表示"><figcaption><b>05 / 82秒：3つの解</b><br>3つの解を、πを使う縦の分数で表示。</figcaption></figure><figure class="portrait"><img src="./portrait-12.jpg" alt="縦型の30秒映画"><figcaption><b>縦型 / 2つの交点</b><br>縦9:16の画角に、数式・図形・座標を配置。</figcaption></figure><figure class="portrait"><img src="./lab-390.jpg" alt="スマートフォンの探究操作画面"><figcaption><b>探究 / タッチ操作と段階的な解答</b><br>角度・高さ・範囲・2D/3D・度/ラジアンを切り替える。</figcaption></figure><figure><img src="./4.5.jpg" alt="4.5秒 / sinθからtへの変形途中"><figcaption><b>4.5秒 / sinθからtへの変形途中</b><br>文字が縮小・回転・移動して、同じ式のtへ変わる。</figcaption></figure><figure><img src="./22.jpg" alt="22秒 / 2つのtの値"><figcaption><b>22秒 / 2つのtの値</b><br>金色と赤色で、半分と−1の2つの解を示す。</figcaption></figure><figure><img src="./49.jpg" alt="49秒 / 赤い水平線の下降"><figcaption><b>49秒 / 赤い水平線の下降</b><br>水平線の高さと、2つの交点が連動して動く。</figcaption></figure></main></html>
