<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-labelledby="title desc"><title id="title">立方体の中点を結ぶ三角形｜3D探究</title><desc id="desc">立方体の中点を結ぶ。3Dで辺・角・面積を探究</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#15283a"/><stop offset="1" stop-color="#0c1726"/></linearGradient><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="600" height="320" fill="url(#bg)"/><g font-family="system-ui,sans-serif"><text x="28" y="38" fill="#e5f1fa" font-size="21" text-anchor="start">立方体の中点を結ぶ</text><polygon points="180.00,130.00 340.00,130.00 340.00,250.00 180.00,250.00" stroke="#6ce2e4" fill="#6ce2e4" fill-opacity="0.031" stroke-width="3"/><polygon points="245.00,75.00 405.00,75.00 405.00,195.00 245.00,195.00" stroke="#ba9cff" fill="none" stroke-width="3"/><line x1="180" y1="130" x2="245" y2="75" stroke="#809db5" stroke-width="2"/><line x1="340" y1="130" x2="405" y2="75" stroke="#809db5" stroke-width="2"/><line x1="340" y1="250" x2="405" y2="195" stroke="#809db5" stroke-width="2"/><line x1="180" y1="250" x2="245" y2="195" stroke="#809db5" stroke-width="2"/><polygon points="260.00,130.00 180.00,190.00 212.50,102.50" stroke="#ffcf78" fill="#ffcf78" fill-opacity="0.188" stroke-width="3"/><circle cx="260" cy="130" r="7" fill="#ffcf78" filter="url(#glow)"/><circle cx="180" cy="190" r="7" fill="#ffcf78" filter="url(#glow)"/><circle cx="212.5" cy="102.5" r="7" fill="#ffcf78" filter="url(#glow)"/><line x1="28" y1="279" x2="572" y2="279" stroke="#30475d" stroke-width="1"/><text x="300" y="304" fill="#809db5" font-size="17" text-anchor="middle">3Dで辺・角・面積を探究</text></g></svg>
