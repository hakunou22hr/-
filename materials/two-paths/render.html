<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>Two Paths WebGL renderer</title><style>html,body{margin:0;background:#030816;overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%}</style></head><body><script type="module">
import {loadMath} from './math.js';import {createFilm,state} from './film.js';import {createWorld} from './webgl.js';
await loadMath(url=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=url}));
const w=1920,h=1080,make=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const rw=Number(new URLSearchParams(location.search).get('bgw')||1280),world=createWorld(rw,Math.round(rw*9/16)),film=createFilm(make,w,h),output=make(w,h),g=output.getContext('2d');output.id='output';document.body.append(output);
window.tpRender={background(t,d=90){world.render(state(t,d));return world.canvas.toDataURL('image/jpeg',.96).split(',')[1];},frame(t,d=90){world.render(state(t,d));const q=film.render(t,d);g.clearRect(0,0,w,h);g.drawImage(world.canvas,0,0,w,h);g.drawImage(film.layers[1],0,0);g.drawImage(film.layers[2],0,0);return q;},info(){return {webgl:world.renderer.capabilities.isWebGL2,renderer:world.renderer.getContext().getParameter(world.renderer.getContext().RENDERER),width:world.canvas.width,height:world.canvas.height,background:'golden-webgl-v7'};}};
window.tpRender.frame(0,90);
</script></body></html>
