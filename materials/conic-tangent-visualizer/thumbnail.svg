<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-labelledby="title desc"><title id="title">数学Ⅲ｜2次曲線の接線</title><desc id="desc">楕円・双曲線・放物線。動く接点から、接線を発見</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#15283a"/><stop offset="1" stop-color="#0c1726"/></linearGradient><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="600" height="320" fill="url(#bg)"/><g font-family="system-ui,sans-serif"><text x="28" y="38" fill="#e5f1fa" font-size="21" text-anchor="start">楕円・双曲線・放物線</text><ellipse cx="280" cy="168" rx="155" ry="77" fill="none" stroke="#6ce2e4" stroke-width="3"/><line x1="315" y1="76.49" x2="535" y2="185.78" stroke="#ffcf78" stroke-width="3"/><circle cx="389.60" cy="113.55" r="6" fill="#ffcf78" filter="url(#glow)"/><text x="413" y="150" fill="#ffcf78" font-size="19" text-anchor="start">接線</text><line x1="28" y1="279" x2="572" y2="279" stroke="#30475d" stroke-width="1"/><text x="300" y="304" fill="#809db5" font-size="17" text-anchor="middle">動く接点から、接線を発見</text></g></svg>
